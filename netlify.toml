# TradeVerse — Netlify configuration.
# The site is a dependency-free static app (no build step): the repository
# root is the publish directory.

[build]
  publish = "."

# Keep internal test files out of reach (override the SPA fallback below).
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# Client-side (hash) routing fallback: unknown paths return the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; form-action 'none'; upgrade-insecure-requests"

# Immutable caching for hashed/static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
